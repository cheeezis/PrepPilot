[project]
name = "preppilot-api"
version = "0.1.0"
description = "Backend API for PrepPilot"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.19.1",
    "fastapi[standard-no-fastapi-cloud-cli]==0.141.1",
    "psycopg[binary]==3.3.4",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
preppilot_api = ["catalog.json"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
