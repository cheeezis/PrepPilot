name: preppilot

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: preppilot
      POSTGRES_USER: preppilot
      POSTGRES_PASSWORD: preppilot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preppilot -d preppilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
